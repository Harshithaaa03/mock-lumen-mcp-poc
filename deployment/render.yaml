# Render.com Blueprint – Mock Lumen MCP Server
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mock-lumen-mcp-poc
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r mcp_server/requirements.txt
    startCommand: cd mcp_server && python server.py --transport streamable-http --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health
    autoDeploy: true
